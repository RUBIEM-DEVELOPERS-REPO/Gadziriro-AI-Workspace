# Tool configuration only. Runtime deps live in requirements.txt (RUBIEM convention).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gadziriro"
version = "0.1.0"
description = "Gadziriro AI Workspace — self-hosted single-tenant ML workspace control plane"
requires-python = ">=3.11"
readme = "../README.md"

[project.scripts]
gadziriro = "gadziriro.cli.main:main"

[tool.setuptools.packages.find]
include = ["gadziriro*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "target_hardware: acceptance test that only passes on Linux+NVIDIA (skipped off-target)",
]
