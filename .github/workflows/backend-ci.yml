name: backend-ci
on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check gadziriro tests
      - name: Format check (black/isort)
        run: |
          black --check gadziriro tests
          isort --check-only gadziriro tests
      - name: Tests (mock backend; target-hardware tests skipped)
        env:
          GADZIRIRO_RUNTIME_BACKEND: mock
        run: pytest -q -m "not target_hardware"
